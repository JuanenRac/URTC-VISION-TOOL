name: URTC CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Run the vision_companion test suite
        working-directory: src/vision_companion
        run: |
          python -m pip install -r requirements.txt -c constraints.txt pytest pytest-cov ruff
          python -m pytest -q --cov=vision_companion --cov-fail-under=88 tests
      - name: Lint the vision_companion package
        working-directory: src/vision_companion
        run: python -m ruff check .
      - name: Type-check the vision_companion package
        working-directory: src/vision_companion
        run: |
          python -m pip install -r requirements.txt -c constraints.txt "mypy>=1.10,<3"
          python -m mypy vision_companion --ignore-missing-imports
      - name: Type check the build scripts and their tests
        run: |
          python -m pip install "mypy==2.4.0"
          python -m mypy bump_manifest_version.py bump_version.py bump.py tools tests --ignore-missing-imports --exclude 'tools/(_readme_svg|make_architecture|make_structure)\.py'
      - name: Run build tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install ARM GNU Toolchain for firmware projects
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Compile firmware without a version bump
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        env:
          URTC_CI: "1"
          URTC_SANITIZE: "1"
          URTC_COVERAGE_FLOOR: "92"
        shell: bash
        run: |
          chmod +x build_firmware.sh
          ./build_firmware.sh
      - name: Keep the images of the build
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-linux
          path: build/firmware
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the ARM GNU Toolchain
        shell: pwsh
        run: |
          choco install gcc-arm-embedded --yes --no-progress
          # The shim is in the Chocolatey folder, which is already on the PATH of the next steps.
          & "$env:ChocolateyInstall\bin\arm-none-eabi-gcc.exe" --version
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Run build tooling tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run the vision_companion test suite
        working-directory: src/vision_companion
        run: |
          python -m pip install -r requirements.txt -c constraints.txt pytest
          python -m pytest -q tests
      - name: Host logic tests and firmware build (the Windows build script)
        env:
          URTC_CI: "1"
        shell: cmd
        run: build_firmware.bat
      - name: Keep the images of the Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-windows
          path: build/firmware
          if-no-files-found: error
          retention-days: 14
