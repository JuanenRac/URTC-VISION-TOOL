[build-system]
# setuptools 77 is the first release that reads the SPDX `license` string below
# (PEP 639); older ones refuse the file, which matters on machines that build
# without network access or without build isolation.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-companion"
dynamic = ["version"]
description = "Vision companion for URTC-VISION-TOOL - thermal (MLX9064x) + RGB dual-modal capture pipeline."
readme = "README.md"
requires-python = ">=3.10"
# GPL-3.0-or-later, same as the rest of this repo (see ../../LICENSE.md) - an SPDX
# string rather than {file = "../../LICENSE.md"}: setuptools refuses to
# package a license file from outside this subdirectory's own root.
license = "GPL-3.0-or-later"
authors = [{ name = "JuanenRac (Electro Hobby 3D)", email = "electrohobby3d@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
vision-companion = "vision_companion.cli:main"

[tool.setuptools]
packages = ["vision_companion"]

[tool.setuptools.dynamic]
version = { attr = "vision_companion.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# long help texts, messages and explanatory comments of the inspection, export and sensor-check commands
"vision_companion/cli.py" = ["E501"]
"vision_companion/export.py" = ["E501"]
"vision_companion/inspection.py" = ["E501"]
"vision_companion/sensor_drift.py" = ["E501"]
"tests/test_inspection.py" = ["E501"]
"tests/test_rack_check.py" = ["E501"]
"vision_companion/rack_check.py" = ["E501"]
"tests/test_rack_watch.py" = ["E501"]
"vision_companion/rack_text.py" = ["E501"]
"vision_companion/rack_watch.py" = ["E501"]
